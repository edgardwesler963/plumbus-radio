        "url": "https://www.googleapis.com/drive/v3/files/1YWMQhbG3L_1dPz9h8sUyMT1XDAb96lBR?alt=media&key=AIzaSyDy69y-cYSZ9yrMlXWTO6YmranCk6sqoYU"
    }
];

    let currentTrackIndex = 0;
    const player = document.getElementById('audio-player');
    const titleDisplay = document.getElementById('track-title');

    function loadTrack(index) {
        const track = playlist[index];
        player.src = track.url;
        titleDisplay.innerText = track.title;
        player.play();
    }

    function playNext() {
        currentTrackIndex++;
        // Lógica de bucle: si llega al final, vuelve al principio
        if (currentTrackIndex >= playlist.length) {
            currentTrackIndex = 0; 
        }
        loadTrack(currentTrackIndex);
    }

    // Event listener crucial: avanza de tema automáticamente cuando termina el actual
    player.addEventListener('ended', playNext);

    // Inicialización del reproductor al cargar la página
    player.src = playlist[0].url;
    titleDisplay.innerText = playlist[0].title;
</script>
