    <style>
        :root {
            --verde: #00ff88;
            --rosa: #e94560;
            --azul: #0f3460;
        }
        * { box-sizing: border-box; }

        @keyframes latido {
            0%   { transform: scale(1);    box-shadow: 0 8px 30px rgba(0, 255, 136, 0.30); }
            15%  { transform: scale(1.03); box-shadow: 0 8px 44px rgba(233, 69, 96, 0.55); }
            30%  { transform: scale(1);    box-shadow: 0 8px 30px rgba(0, 255, 136, 0.30); }
            45%  { transform: scale(1.03); box-shadow: 0 8px 44px rgba(233, 69, 96, 0.55); }
            100% { transform: scale(1);    box-shadow: 0 8px 30px rgba(0, 255, 136, 0.30); }
        }
        .latido-activo {
            animation: latido 1.3s infinite;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #eaf0ff;
            font-family: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
            background-color: #0b1020;
            background-image:
                linear-gradient(160deg, rgba(8, 10, 30, 0.55), rgba(8, 10, 30, 0.82)),
                url('fondo_app.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .player-container {
            width: 100%;
            max-width: 400px;
            padding: 22px;
            border-radius: 28px;
            text-align: center;
            background: rgba(18, 24, 52, 0.72);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(0, 255, 136, 0.12);
        }

        .logo {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 20px;
            margin-bottom: 18px;
            background: radial-gradient(circle at 50% 40%, #16224a, #0a1024);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.40);
            transition: opacity 0.4s;
        }

        .ahora {
            font-size: 0.72em;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--verde);
            margin-bottom: 6px;
        }

        .title-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-bottom: 18px;
            -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
        }
        #track-title {
            display: inline-block;
            white-space: nowrap;
            padding: 0 30px;
            font-size: 1.1em;
            font-weight: 600;
            color: #fff;
        }
        #track-title.corre {
            animation: vaiven var(--dur, 10s) ease-in-out infinite alternate;
        }
        @keyframes vaiven {
            0%, 12%   { transform: translateX(0); }
            88%, 100% { transform: translateX(var(--mover, 0px)); }
        }

        /* El reproductor nativo del navegador queda oculto; usamos el nuestro */
        audio { display: none; }

        .reproductor {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 16px;
        }
        .progreso { flex: 1; }
        .tiempos {
            display: flex;
            justify-content: space-between;
            font-size: 0.75em;
            color: #9fb0d6;
            margin-top: 6px;
        }

        /* Barras (progreso y volumen) */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            background: linear-gradient(90deg, var(--verde) var(--pct, 0%), rgba(255, 255, 255, 0.15) var(--pct, 0%));
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
        }
        input[type=range]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none;
            background: #fff;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.8);
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            font-size: 1.1em;
        }

        button {
            font-family: inherit;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, background 0.25s, box-shadow 0.25s;
        }

        .btn-play {
            flex: none;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            color: #06221a;
            background: linear-gradient(135deg, var(--verde), #00c2a8);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.35);
        }
        .btn-play:hover { transform: scale(1.06); }
        .btn-play:active { transform: scale(0.96); }

        .controls button {
            padding: 11px 18px;
            border-radius: 999px;
            font-size: 0.95em;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .controls button:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
        }
        .controls .primario {
            background: linear-gradient(135deg, var(--rosa), #ff7a59);
            border-color: transparent;
            box-shadow: 0 6px 18px rgba(233, 69, 96, 0.35);
        }
        .controls .primario:hover {
            background: linear-gradient(135deg, #ff4f6d, #ff8a69);
        }
        #like-btn.liked {
            background: rgba(233, 69, 96, 0.25);
            border-color: var(--rosa);
        }

        .oyentes {
            margin-top: 22px;
            text-align: center;
        }
        .oyentes span {
            font-size: 0.75em;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #9fb0d6;
        }
    
        /* ===== Redes y café ===== */
        .social {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .social-fila {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .social-btn {
            color: #fff;
            text-decoration: none;
            font-size: 0.85em;
            font-weight: 600;
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            transition: transform 0.15s, background 0.25s;
        }
        .social-btn:hover {
            background: rgba(255, 255, 255, 0.16);
            transform: translateY(-1px);
        }
        .cafe-btn {
            display: block;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95em;
            padding: 12px 18px;
            border-radius: 999px;
            color: #2b1a00;
            background: linear-gradient(135deg, #ffd45e, #ffb02e);
            box-shadow: 0 6px 18px rgba(255, 176, 46, 0.30);
            transition: transform 0.15s, box-shadow 0.25s;
        }
        .cafe-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255, 176, 46, 0.45);
        }
    </style>
</head>

    let currentTrackIndex = -1;
    let currentCoverIndex = -1;
    
    const player = document.getElementById('audio-player');
    const titleDisplay = document.getElementById('track-title');
    const coverDisplay = document.getElementById('radio-cover');
    const volumeSlider = document.getElementById('volume-slider');
    const likeBtn = document.getElementById('like-btn');
    const downloadLink = document.getElementById('download-link');

    let likedTracks = JSON.parse(localStorage.getItem('plumbus_likes')) || {};

    function mostrarTitulo(texto) {
        titleDisplay.innerText = texto;
        titleDisplay.classList.remove('corre');
        titleDisplay.style.removeProperty('--mover');
        // Medimos cuando el navegador ya acomodó el texto
        requestAnimationFrame(function() {
            const sobra = titleDisplay.offsetWidth - titleDisplay.parentElement.clientWidth;
            if (sobra > 0) {
                titleDisplay.style.setProperty('--mover', (-sobra) + 'px');
                titleDisplay.style.setProperty('--dur', Math.max(6, sobra / 25) + 's');
                titleDisplay.classList.add('corre');
            }
        });
    }

    function playRandom() {
        if(playlist.length === 0) return;
        
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * playlist.length);
        } while (newIndex === currentTrackIndex && playlist.length > 1);
        
        currentTrackIndex = newIndex;
        const track = playlist[currentTrackIndex];
        
        player.src = track.url;
        mostrarTitulo(track.title);
        downloadLink.href = track.url;
        
        // Verificar Likes guardados
        if (likedTracks[track.title]) {
            likeBtn.classList.add('liked');
            likeBtn.innerText = '¡Te gusta! ❤️';
        } else {
            likeBtn.classList.remove('liked');
            likeBtn.innerText = 'Me Gusta 👍';
        }

        // Cambiar portada aleatoria
        if(covers.length > 0) {
            let newCover;
            do {
                newCover = Math.floor(Math.random() * covers.length);
            } while (newCover === currentCoverIndex && covers.length > 1);
            currentCoverIndex = newCover;
            coverDisplay.src = covers[currentCoverIndex];
        }

        const intento = player.play();
        if (intento !== undefined) {
            intento.catch(function(e) {
                // El navegador bloquea el sonido automático al abrir la página: no es un fallo de la canción
                if (e.name === 'NotAllowedError') {
                    mostrarTitulo('▶️ Tocá play para arrancar: ' + track.title);
                }
            });
        }
    }

    function likeCurrentTrack() {
        if (currentTrackIndex === -1) return;
        const currentTitle = playlist[currentTrackIndex].title;
        
        if (likedTracks[currentTitle]) {
            delete likedTracks[currentTitle];
            likeBtn.classList.remove('liked');
            likeBtn.innerText = 'Me Gusta 👍';
        } else {
            likedTracks[currentTitle] = true;
            likeBtn.classList.add('liked');
            likeBtn.innerText = '¡Te gusta! ❤️';
        }
        localStorage.setItem('plumbus_likes', JSON.stringify(likedTracks));
    }

    // Efecto de latido al reproducir
    player.addEventListener('play', function() {
        coverDisplay.classList.add('latido-activo');
    });
    
    player.addEventListener('pause', function() {
        coverDisplay.classList.remove('latido-activo');
    });

    player.addEventListener('ended', playRandom);

    // Si una canción no carga, avisa y salta a otra (con un tope para no quedar en bucle)
    let fallosSeguidos = 0;

    player.addEventListener('playing', function() {
        fallosSeguidos = 0;
    });

    player.addEventListener('error', function() {
        if (currentTrackIndex === -1) return;
        fallosSeguidos++;

        if (fallosSeguidos >= playlist.length) {
            mostrarTitulo('⚠️ No se pudo cargar ninguna canción. Probá de nuevo más tarde.');
            return;
        }

        const nombre = playlist[currentTrackIndex].title;
        mostrarTitulo('⚠️ No cargó: ' + nombre + ' (pasando a la siguiente...)');
        setTimeout(playRandom, 2500);
    });

    volumeSlider.addEventListener('input', function() {
        player.volume = this.value;
    });

    // ===== Reproductor propio (reemplaza los controles del navegador) =====
    const playBtn = document.getElementById('play-btn');
    const seek = document.getElementById('seek');
    const tActual = document.getElementById('t-actual');
    const tTotal = document.getElementById('t-total');

    const ICONO_PLAY = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
    const ICONO_PAUSA = '<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';

    function formatoTiempo(seg) {
        if (!isFinite(seg)) return '0:00';
        const m = Math.floor(seg / 60);
        const r = Math.floor(seg % 60);
        return m + ':' + String(r).padStart(2, '0');
    }

    // Pinta de verde la parte recorrida de una barra
    function pintar(barra) {
        const pct = ((barra.value - barra.min) / (barra.max - barra.min)) * 100;
        barra.style.setProperty('--pct', pct + '%');
    }

    playBtn.addEventListener('click', function() {
        if (!player.getAttribute('src')) return;
        if (player.paused) {
            const p = player.play();
            if (p !== undefined) p.catch(function() {});
        } else {
            player.pause();
        }
    });

    player.addEventListener('play', function() { playBtn.innerHTML = ICONO_PAUSA; });
    player.addEventListener('pause', function() { playBtn.innerHTML = ICONO_PLAY; });

    player.addEventListener('loadstart', function() {
        seek.value = 0;
        pintar(seek);
        tActual.innerText = '0:00';
        tTotal.innerText = '0:00';
    });

    player.addEventListener('loadedmetadata', function() {
        tTotal.innerText = formatoTiempo(player.duration);
    });

    player.addEventListener('timeupdate', function() {
        if (isFinite(player.duration) && player.duration > 0) {
            seek.value = (player.currentTime / player.duration) * 100;
            pintar(seek);
        }
        tActual.innerText = formatoTiempo(player.currentTime);
    });

    seek.addEventListener('input', function() {
        if (isFinite(player.duration)) {
            player.currentTime = (seek.value / 100) * player.duration;
        }
        pintar(seek);
    });

    volumeSlider.addEventListener('input', function() { pintar(volumeSlider); });

    playBtn.innerHTML = ICONO_PLAY;
    pintar(seek);
    pintar(volumeSlider);

    if(playlist.length > 0) {
        playRandom();
    }
