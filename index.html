    <style>
        @keyframes latido {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
            15% { transform: scale(1.05); box-shadow: 0 0 40px rgba(233, 69, 96, 0.8); }
            30% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
            45% { transform: scale(1.05); box-shadow: 0 0 40px rgba(233, 69, 96, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
        }
        .latido-activo {
            animation: latido 1.3s infinite;
            border-color: #e94560 !important;
        }

        body {
            background-color: #1a1a2e;
            background-image: url('fondo_app.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .player-container {
            background-color: #16213e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }
        .logo {
            width: 100%;
            height: 250px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #0f3460;
            background-color: #0b132b;
            transition: opacity 0.4s;
        }
        .title-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
            margin-bottom: 15px;
            background-color: #0f3460;
            border-radius: 5px;
            padding: 5px 0;
            border: 1px solid #e94560;
        }
        #track-title {
            display: inline-block;
            font-size: 1.2em;
            color: #e94560;
            padding-left: 100%;
            animation: marquee 12s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        audio {
            width: 100%;
            margin-bottom: 15px;
        }
        .volume-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: #e94560;
        }
        input[type=range] {
            margin-left: 10px;
            cursor: pointer;
        }
        button {
            background-color: #0f3460;
            color: white;
            border: 2px solid #e94560;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            font-family: inherit;
            transition: 0.3s;
        }
        button:hover {
            background-color: #e94560;
        }
    </style>

<body>

    <img id="radio-cover" src="logo.png" alt="Plumbus Radio" class="logo">
    
    <div class="title-container">
        <div id="track-title">Conectando al Multiverso...</div>
    </div>
    
    <audio id="audio-player" controls></audio>
    
    <div class="volume-container">
        <label for="volume-slider">Volumen:</label>

    </div>

    <div class="controls" style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">

        "https://www.googleapis.com/drive/v3/files/1qeVD26TGUzmQljeHPS-ZVvaj5RAU7hlY?alt=media&key=AIzaSyDy69y-cYSZ9yrMlXWTO6YmranCk6sqoYU"
    ];

    let currentTrackIndex = -1;
    let currentCoverIndex = -1;
    
    const player = document.getElementById('audio-player');
    const titleDisplay = document.getElementById('track-title');
    const coverDisplay = document.getElementById('radio-cover');
    const volumeSlider = document.getElementById('volume-slider');
    const likeBtn = document.getElementById('like-btn');
    const downloadLink = document.getElementById('download-link');

    let likedTracks = JSON.parse(localStorage.getItem('plumbus_likes')) || {};

    function playRandom() {
        if(playlist.length === 0) return;
        
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * playlist.length);
        } while (newIndex === currentTrackIndex && playlist.length > 1);
        
        currentTrackIndex = newIndex;
        const track = playlist[currentTrackIndex];
        
        player.src = track.url;
        titleDisplay.innerText = track.title;
        downloadLink.href = track.url;
        
        // Verificar Likes guardados
        if (likedTracks[track.title]) {
            likeBtn.style.backgroundColor = '#e94560';
            likeBtn.innerText = '¡Te gusta! ❤️';
        } else {
            likeBtn.style.backgroundColor = '#0f3460';
            likeBtn.innerText = 'Me Gusta 👍';
        }

        // Cambiar portada aleatoria
        if(covers.length > 0) {
            let newCover;
            do {
                newCover = Math.floor(Math.random() * covers.length);
            } while (newCover === currentCoverIndex && covers.length > 1);
            currentCoverIndex = newCover;
            coverDisplay.src = covers[currentCoverIndex];
        }

        player.play();
    }

    function likeCurrentTrack() {
        if (currentTrackIndex === -1) return;
        const currentTitle = playlist[currentTrackIndex].title;
        
        if (likedTracks[currentTitle]) {
            delete likedTracks[currentTitle];
            likeBtn.style.backgroundColor = '#0f3460';
            likeBtn.innerText = 'Me Gusta 👍';
        } else {
            likedTracks[currentTitle] = true;
            likeBtn.style.backgroundColor = '#e94560';
            likeBtn.innerText = '¡Te gusta! ❤️';
        }
        localStorage.setItem('plumbus_likes', JSON.stringify(likedTracks));
    }

    // Efecto de latido al reproducir
    player.addEventListener('play', function() {
        coverDisplay.classList.add('latido-activo');
    });
    
    player.addEventListener('pause', function() {
        coverDisplay.classList.remove('latido-activo');
    });

    player.addEventListener('ended', playRandom);
    
    volumeSlider.addEventListener('input', function() {
        player.volume = this.value;
    });

    if(playlist.length > 0) {
        playRandom();
    }
